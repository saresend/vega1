[workspace]
resolver = "3"
members = ["crates/vs1-core", "crates/vs1-wasm", "crates/vs1-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = "0.22"
vs1-core = { path = "crates/vs1-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
