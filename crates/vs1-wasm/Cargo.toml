[package]
name = "vs1-wasm"
description = "Browser bindings for vs1-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
vs1-core.workspace = true
# Must match the installed wasm-bindgen CLI version exactly.
wasm-bindgen = "=0.2.129"

# tokenizers/tract pull in getrandom 0.2 and 0.3; on wasm32 both need the JS
# (crypto.getRandomValues) backend. 0.3 also needs the cfg in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
